[project]
name = "stratfile"
version = "0.1.0"
description = "Dockerfile for trading strategies: deterministic stratfile.json + signed backtest receipt + on-chain executor on BSC Testnet."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anand-0037" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
    "jsonschema>=4.22,<5.0",
    "httpx>=0.27,<1.0",
    "duckdb>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35,<2.0",
    "web3>=6.19,<8.0",
    "eth-account>=0.11",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.4"]

[project.scripts]
stratfile = "stratfile.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratfile"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
